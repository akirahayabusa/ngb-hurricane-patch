.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 30%,rgba(11,10,13,.55) 65%,rgba(11,10,13,.15)),linear-gradient(0deg,var(--ink),transparent 40%)}
.hero .in{position:relative;z-index:1;padding-block:64px 40px}
.topbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:34px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--blood)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid var(--ink-3);background:rgba(11,10,13,.6)}
.seg button{background:none;border:0;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ash)}
.seg button[aria-pressed="true"]{background:var(--blood);color:#fff}
.btn{background:rgba(11,10,13,.6);border:1px solid var(--ink-3);padding:4px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(32px,5.6vw,56px);line-height:1.18;margin:0 0 .35em;text-wrap:balance;letter-spacing:.02em;max-width:15em;text-shadow:0 2px 20px #000}
.hero h1 em{font-style:normal;color:var(--blood)}
.hero .sub{color:#cfc8bd;max-width:56ch;margin:0;text-shadow:0 1px 8px #000}
.dl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:24px}
.dl a.go{display:inline-flex;align-items:center;gap:12px;background:var(--blood);color:#fff;text-decoration:none;font-family:var(--f-display);font-weight:900;font-size:20px;
  padding:12px 26px 12px 20px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;transition:filter .15s,transform .15s}
.dl a.go.alt{background:transparent;color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;font-size:17px}
.dl.ja-first a.go.alt{order:-1;background:var(--blood);color:#fff;box-shadow:none;font-size:20px}
.dl.ja-first a.go:not(.alt){background:transparent;color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;font-size:17px}
.dl a.go:hover{filter:brightness(1.15);transform:translateY(-1px)}

   {k:"new",l:"B2 C2",t:{zh:"<b>一代交差之法版（飓风origin）首发</b>：改用黑之章数据里保留的、与飓风包一模一样的那套交差之法。交差后隼龙向后退一段距离，接 Y 的窗口更长，停一下再按也能出瞬间蓄力。只改招式数据 20 个字节，程序未改。",
     en:"<b>The 2004-Intercept edition (Hurricane origin) debuts</b>: uses the Intercept set kept in Black's data that is identical to the Hurricane Pack. Ryu steps back after Intercept and the Y window is longer, so Y still works after a short pause. Only 20 bytes of move data change; no code.",
     ja:"<b>初代交差の法の版（ハリケーン origin）初公開</b>：『Black』のデータに残っている、ハリケーンパックとまったく同じ交差の法を使用。交差後にリュウが少し後退し、Y の猶予が長く、間を置いても溜め攻撃が出ます。技データ 20 バイトのみ変更、プログラムは無変更。"}},
   {k:"misc",l:HUR,t:{zh:"标题画面右下角的 “CZ” 重新绘制：C、Z 错开排列，一道刀光从中间斩开。",en:"The title-screen “CZ” is redrawn: staggered C and Z split by a sword flash.",ja:"タイトル画面の「CZ」を描き直し（C と Z をずらし、刀の閃きで切り分け）。"}},
   {k:"fix",l:"B C",only:true,t:{zh:"撤回第 7 版的交差之法改动（隼龙后退后又瞬移回原位），交差之法与 6b 相同。",en:"Reverts v7's Intercept change (Ryu stepped back, then snapped to his old position); Intercept is as in 6b.",ja:"第 7 版の交差の法の変更（後退後に元の位置へ瞬間移動）を取り消し、6b と同じに。"}},
   {k:"zh",l:BZH,t:{zh:"村正的台词“做买卖可不能太贪心哪”改为“……呐”。",en:"One sentence-final particle fixed in a Muramasa line.",ja:"ムラマサの台詞の語気詞を 1 か所修正。"}}
  ]},
 {date:"2026-10-04", withdrawn:true, flags:["wd"], v:{B:"vb-zh-7",C:"vb-jp-7"},
  title:{zh:"7 · 已撤回",en:"7 · Withdrawn",ja:"7 · 取り下げ"},
  lead:{zh:"换回飓风包的交差反击动作，但会出现隼龙后退后又瞬移回原位的问题，同日由 6c 撤回；正确的做法后来成为飓风origin。",en:"Swapped in the Hurricane Pack counter animation, but Ryu snapped back after stepping away; withdrawn the same day by 6c. Done properly, it became Hurricane origin.",ja:"ハリケーンパックの反撃モーションに戻したものの、後退後に瞬間移動で戻る問題があり、同日 6c で取り下げ。正しい形がのちのハリケーン origin です。"},
  items:[
   {k:"misc",l:"B C",only:true,t:{zh:"交差之法接蓄力 Y 的时机放宽（反击动作换回飓风包的约 20 多帧版本）。",en:"Wider Y window after Intercept (Hurricane Pack counter animation, 20+ frames).",ja:"交差後の Y 派生の猶予を拡大（ハリケーンパックの 20 フレーム超の反撃モーション）。"}}
  ]},
 {date:"2026-10-03", v:{A:"va-zh-6b",B:"vb-zh-6b",C:"vb-jp-6b"},
  title:{zh:"6b · 翻译修正与“飓风版”定名",en:"6b · Translation fix; “Hurricane” name",ja:"6b · 翻訳修正と「ハリケーン版」への改名"},
  items:[
   {k:"zh",l:ZH,t:{zh:"<b>修正一处误译</b>：泰隆城过场瑞秋的台词“妹を”原误译成龙的问话“你的妹妹”，改为“我的妹妹……”。",en:"<b>Mistranslation fixed</b>: Rachel's “妹を” in a Tairon cutscene was rendered as Ryu asking “your sister”; now “my sister…”.",ja:"<b>誤訳を修正</b>：タイロンの過場でレイチェルの「妹を」をリュウの問いかけと誤訳していたのを「私の妹……」に。"}},
   {k:"zh",l:ZH,t:{zh:"补译两处英文提示：存档界面 “SAVE 编号” → “存档 编号”，查看文书时 “Ⓧ Proceed” → “Ⓧ 继续”。",en:"Two leftover English prompts translated: “SAVE n” on the save screen and “Ⓧ Proceed” when reading documents.",ja:"英語のまま残っていた 2 か所（セーブ画面の「SAVE 番号」、文書の「Ⓧ Proceed」）を翻訳。"}},
   {k:"zh",l:"A",t:{zh:"村正的台词“做买卖可不能太贪心哪”改为“……呐”。",en:"One sentence-final particle fixed in a Muramasa line.",ja:"ムラマサの台詞の語気詞を 1 か所修正。"}},
   {k:"misc",l:HUR,t:{zh:"标题画面 “version Hurricane” 后加上刀剑风格的金属字 “CZ”；“完全版”更名为“<b>飓风版</b>”。",en:"A metallic sword-style “CZ” after “version Hurricane” on the title screen; “Complete edition” renamed to <b>Hurricane edition</b>.",ja:"タイトル画面の「version Hurricane」の後ろに刀剣風の「CZ」を追加。「完全版」を<b>ハリケーン版</b>に改名。"}}
  ]},
 {date:"2026-10-03", flags:["x360"], v:{B:"vb-zh-6a",C:"vb-jp-6a"},
  title:{zh:"6a · 360 开机关机修复",en:"6a · Xbox 360 power-off fix",ja:"6a · 360 の電源断を修正"},
  items:[
   {k:"360",l:HUR,t:{zh:"<b>修复 360 过警告画面即关机</b>：二周目修复的代码挪到补丁区最后，其余代码回到与 5b 完全相同的位置。",en:"<b>Fixed the Xbox 360 powering off after the warning screen</b>: the New Game+ fix code moved to the end of the patch area; everything else back where it was in 5b.",ja:"<b>360 で警告画面のあと電源が切れる問題を修正</b>：二周目修正のコードをパッチ領域の最後へ移し、他は 5b と同じ位置に。"}}
  ]},
 {date:"2026-10-02", v:{A:"va-zh-6",B:"vb-zh-6",C:"vb-jp-6"},
  title:{zh:"6 · 存读档界面汉化，二周目修复",en:"6 · Save/load screens translated; New Game+ fix",ja:"6 · セーブ画面の翻訳、二周目の修正"},
  items:[
   {k:"zh",l:ZH,t:{zh:"<b>存档 / 读档界面汉化</b>：章节 / 存档点 / 游戏时间 / 难度 / 业力 / 玩家代号、超忍锦标赛、选择 / 返回、完成。",en:"<b>Save/load screens translated</b>: chapter, save point, play time, difficulty, karma, player tag, Master Ninja Tournament, select/back, clear.",ja:"<b>セーブ／ロード画面を翻訳</b>（章・セーブポイント・プレイ時間・難易度・カルマ・ゲーマータグ等）。"}},
   {k:"zh",l:ZH,t:{zh:"各画面的 “Information” 统一为“说明”；飓风包任务 “ETERNAL LEGEND” 译为“永恒传说”。",en:"“Information” labels unified as “说明” on every screen; the Hurricane mission “ETERNAL LEGEND” translated.",ja:"各画面の「Information」を「说明」に統一。ハリケーンパックのミッション「ETERNAL LEGEND」を翻訳。"}},
   {k:"fix",l:HUR,t:{zh:"<b>二周目修复</b>：读通关存档开始的新一轮若在第一次存档前死亡，和初代一样只显示 GAME OVER；之前选继续会变成普通新游戏，金圣甲虫全部丢失。",en:"<b>New Game+ fix</b>: dying before the first save in a cleared-data run now shows only GAME OVER, as in the 2004 game; before, “continue” turned it into a normal new game and lost every Golden Scarab.",ja:"<b>二周目の修正</b>：クリアデータからの周回で最初のセーブ前に倒れると、初代と同じく GAME OVER のみ表示。以前は続行で通常の新規ゲームになり、黄金のスカラベを失っていました。"}}
  ]},
 {date:"2026-10-02", flags:["x360"], v:{A:"va-zh-5b",B:"vb-zh-5b"},
  title:{zh:"5b · 通关结算画面汉化",en:"5b · Results screens translated",ja:"5b · クリア画面の翻訳"},
  items:[
   {k:"360",l:ZH,t:{zh:"<b>修复 360 进入“情报 → 章节”页崩溃</b>：5a 新改成中文的 4 处恢复为英文。",en:"<b>Fixed an Xbox 360 crash on the Info → Chapter page</b>: the four strings translated in 5a are English again.",ja:"<b>360 で「情報 → 章」画面がクラッシュする問題を修正</b>（5a で翻訳した 4 か所を英語に戻す）。"}},
   {k:"zh",l:ZH,t:{zh:"<b>通关结算画面汉化</b>：“第 N 章　完成”、“全部通关”、各统计栏和“请按 START 键”，风格与原版贴图一致。",en:"<b>Results screens translated</b>: chapter-clear and all-clear plates, statistics and “Press START”, matching the original artwork.",ja:"<b>クリア画面を翻訳</b>（章クリア・全クリア・各集計・「PRESS START」、オリジナルの画風に合わせて）。"}}
  ]},
 {date:"2026-10-02", v:{A:"va-zh-5a",B:"vb-zh-5a"},
  title:{zh:"5a · 补译“调查”提示",en:"5a · “Interact” prompts translated",ja:"5a · 「調べる」表示の翻訳"},

   {k:"zh",l:ZH,t:{zh:"魔界、地下水道、泰隆城共 10 处仍显示 “Interact” 的提示改为“调查”。",en:"Ten “Interact” prompts in the Underworld, the aqueduct and Tairon translated.",ja:"魔界・地下水路・タイロンの 10 か所の「Interact」を翻訳。"}},
   {k:"zh",l:ZH,t:{zh:"补译 Chapter / PHASE / Rachel / Total Karma 4 处英文（5b 因 360 崩溃撤回）。",en:"Chapter / PHASE / Rachel / Total Karma translated (reverted in 5b after the 360 crash).",ja:"Chapter／PHASE／Rachel／Total Karma を翻訳（5b で 360 のクラッシュのため取り消し）。"}}
  ]},
 {date:"2026-10-02", v:{A:"va-zh-5",B:"vb-zh-5",C:"vb-jp-5"},
  title:{zh:"5 · 村正商店汉化",en:"5 · Muramasa's shop translated",ja:"5 · ムラマサの店の翻訳"},
  items:[
   {k:"zh",l:ZH,t:{zh:"<b>村正商店汉化</b>：招牌“村正武器道具店”（金字压磨砂方牌，原版风格），商店 / 锻造 / 交谈、合计、售罄、新、等级等全部中文。",en:"<b>Muramasa's shop translated</b>, including a new shop sign in the original style, buy / upgrade / talk, totals, sold out, new and level.",ja:"<b>ムラマサの店を翻訳</b>（オリジナル風の看板、購入・強化・会話、合計、売り切れ、NEW、レベルなど）。"}},
   {k:"zh",l:ZH,t:{zh:"暂停菜单六块铁牌恢复金属拉丝质感；HITS 改为“连击”；关卡通关后的 Proceed 改为“继续”；“龙之珠”改为“龙之勾玉”。",en:"Pause-menu plates back to brushed metal; HITS → 连击; Proceed after a stage → 继续; “Dragon's Eye” renamed to 龙之勾玉.",ja:"ポーズメニューの金属プレートの質感を復元、HITS・Proceed を翻訳、「龍の珠」を「龍の勾玉」に。"}},
   {k:"new",l:HUR,t:{zh:"<b>交差之法结算显示</b>：倒计时内成功交差，战斗结束的结算栏会像飓风包一样多出“交差”一行，每次加 1000。",en:"<b>Intercept bonus on the battle results</b>: like the Hurricane Pack, an Intercept line (+1000 each) appears under the tally.",ja:"<b>交差の法の集計表示</b>：ハリケーンパックと同じく、戦闘後の集計に「Intercept」行（1 回 1000）を表示。"}}
  ]},
 {date:"2026-10-01", v:{A:"va-zh-4",B:"vb-zh-4",C:"vb-jp-4"},
  title:{zh:"4 · 暂停菜单汉化，思源黑体粗体",en:"4 · Pause menu translated; Source Han Sans Bold",ja:"4 · ポーズメニューの翻訳、源ノ角ゴシック Bold"},
  lead:{zh:"从这一版起，文件名里的括号统一为半角 [ ]。",en:"From this release file names use ASCII brackets [ ].",ja:"この版からファイル名の括弧を半角 [ ] に統一。"},
  items:[
   {k:"zh",l:ZH,t:{zh:"<b>暂停菜单汉化</b>：武器 / 忍法 / 道具 / 情报 / 地图 / 返回六个标签页及各页按钮提示。",en:"<b>Pause menu translated</b>: the six tabs and every page's button prompts.",ja:"<b>ポーズメニューを翻訳</b>（6 つのタブと各画面のボタン表示）。"}},
   {k:"zh",l:ZH,t:{zh:"<b>补译残留英文</b>：存档、载入中、结算画面、任务模式各项、旗帜选择的 27 个国家和地区名等。",en:"<b>Remaining English translated</b>: saving, loading, results, mission-mode labels, 27 flag names and more.",ja:"<b>残っていた英語を翻訳</b>（セーブ・ロード中・集計・ミッション関連・国旗 27 種など）。"}},
   {k:"zh",l:ZH,t:{zh:"用词调整：“业”改为“<b>业力</b>”，“技表”改为“<b>招式表</b>”，语言名“日语”改为“亚洲”（语音仍是日语）。",en:"Wording: karma 业 → <b>业力</b>, move list 技表 → <b>招式表</b>, language name “Japanese” → “Asia” (voices stay Japanese).",ja:"用語変更：カルマ「业」→「业力」、技表→「招式表」、言語名「日本語」→「アジア」（音声は日本語のまま）。"}},
   {k:"misc",l:ZH,t:{zh:"游戏内文字改为<b>思源黑体粗体</b>，笔画更粗更清晰。",en:"In-game text switched to <b>Source Han Sans Bold</b> for sharper strokes.",ja:"ゲーム内文字を<b>源ノ角ゴシック Bold</b> に変更。"}},
   {k:"misc",l:HUR,t:{zh:"标题画面右下角加上银白色 “version Hurricane” 标识。",en:"Silver “version Hurricane” mark added to the title screen.",ja:"タイトル画面右下に銀白の「version Hurricane」を表示。"}}
  ]},
 {date:"2026-09-30", v:{A:"va-zh-3",B:"vb-zh-3",C:"vb-jp-3"},
  title:{zh:"3 · 新版本命名，细十字准星",en:"3 · New version names; thin crosshair",ja:"3 · 新しいバージョン名、細い照準"},
  lead:{zh:"版本名改为 基本版 va-zh-N / 飓风版 vb-zh-N（中文）/ vb-jp-N（日文）。",en:"Versions renamed: Basic va-zh-N / Hurricane vb-zh-N (Chinese) / vb-jp-N (Japanese).",ja:"バージョン名を 基本版 va-zh-N／ハリケーン版 vb-zh-N（中国語）／vb-jp-N（日本語）に変更。"},
  items:[
   {k:"misc",l:"A B C",t:{zh:"<b>准星改为细“+”</b>（玩家反馈旧准星太大太粗）：白色细十字，只带一层淡投影。",en:"<b>Crosshair is now a thin “+”</b> (the old one was too big): white, with a faint shadow only.",ja:"<b>照準を細い「＋」に</b>（大きすぎるとの報告を受けて）。白い細十字で薄い影のみ。"}},
   {k:"zh",l:"B",t:{zh:"秘传书「交错之法」改名为「<b>交差之法</b>」（沿用日文原名汉字）。",en:"The Intercept scroll's Chinese name changed to 交差之法 (the Japanese kanji).",ja:"秘伝書の中国語名を「交差之法」に（日本語原名の漢字を採用）。"}}
  ]},
 {date:"2026-09-29", v:{A:"v1.1c",B:"v1.3.9",C:"v1.3.9-jp"},
  title:{zh:"v1.3.9 / v1.1c · 鬼彻扣血修正，补上漏译",en:"v1.3.9 / v1.1c · Kitetsu drain fix; missing text",ja:"v1.3.9 / v1.1c · 鬼徹の修正、訳漏れの補完"},
  items:[
   {k:"fix",l:"B C",t:{zh:"<b>鬼彻扣血修正</b>：一、二、三级都会持续扣血，所有难度都扣；规则与初代一致，每约 0.08 秒扣 1 点，最多扣到剩 1 血。",en:"<b>Kitetsu drain fixed</b>: drains at all three levels and on every difficulty, as in the 2004 game: 1 point every ~0.08 s, never below 1.",ja:"<b>妖刀鬼徹の体力減少を修正</b>：一〜三段階・全難易度で減少。初代と同じく約 0.08 秒ごとに 1、残り 1 で停止。"}},
   {k:"zh",l:"A B",t:{zh:"<b>补上漏译</b>：任务目标文字、第 2 章隼之里的调查说明、塔伊尔城武器店老人的对话、「无法携带更多了。」等一直是日文的脚本文字。",en:"<b>Missing translations added</b>: mission objectives, Chapter 2 Hayabusa Village descriptions, the Tairon shopkeeper's lines and other script text still in Japanese.",ja:"<b>訳漏れを補完</b>：ミッション目標、第 2 章隼の里の説明、タイロンの店主の会話など日本語のまま残っていた文字。"}}
  ]},
 {date:"2026-09-29", v:{B:"v1.3.8",C:"v1.3.8-jp"},
  title:{zh:"v1.3.8 · 读档选服装修正",en:"v1.3.8 · Costume trigger on load fixed",ja:"v1.3.8 · ロード時の衣装選択を修正"},
  items:[
   {k:"fix",l:"B C",t:{zh:"读档开始游戏时按住扳机选服装没有反应的问题：在读取画面按住扳机确认存档，按到画面淡出、听到喊声即可。",en:"Trigger costume select now works when loading a save: hold the trigger while confirming the save until the shout.",ja:"ロード時にトリガーで衣装が選べない問題を修正：トリガーを押しながらセーブデータを決定し、掛け声まで押し続けます。"}}
  ]},
 {date:"2026-09-28", v:{B:"v1.3.7",C:"v1.3.7-jp"},
  title:{zh:"v1.3.7 · 三种扳机秘籍服装",en:"v1.3.7 · Three trigger costumes",ja:"v1.3.7 · トリガーで 3 種の隠し衣装"},
  items:[
   {k:"new",l:"B C",t:{zh:"<b>补全初代的另一套秘籍服装</b>：开局前最后一次确认时按住 LT+RT 紫色默认服 / LT 未来忍者装（光剑）/ RT 诅咒隼龙，听到喊声即生效。",en:"<b>The 2004 game's other secret costume added</b>: hold LT+RT for the purple default, LT for Future Ninja (light saber), RT for Cursed Ryu at the final confirm.",ja:"<b>初代のもう一つの隠し衣装を追加</b>：最後の決定時に LT+RT で紫の標準衣装、LT で未来忍者（光の剣）、RT で呪われたリュウ。"}},
   {k:"fix",l:"B C",t:{zh:"触发时机统一到“真正开始游戏之前”，剧情和任务都只判断一次；喊声完整播完再开始读取。",en:"The check happens once, right before the game starts, in story and missions; loading waits for the shout to finish.",ja:"判定はゲーム開始直前の 1 回に統一（ストーリー・ミッション共通）。掛け声を最後まで再生してから読み込み。"}}
  ]},
 {date:"2026-09-28", flags:["new"], v:{A:"v1.1b",B:"v1.3.6",C:"v1.3.6-jp"},

   {k:"new",l:"C",t:{zh:"<b>日英版首发</b>：不汉化，游戏内日文文字与图片保持原样，只加入中文版的全部玩法改进。",en:"<b>Japanese build debuts</b>: original Japanese text and images, with all the gameplay changes of the Chinese build.",ja:"<b>日英版を初公開</b>：日本語の文字・画像はオリジナルのまま、中国語版の機能追加のみを収録。"}},

 {date:"2026-09-28", v:{B:"v1.3.5"},

const ISSUES = {
 zh:["主机系统语言为英文时，开机的版权警告仍显示英文（进游戏后正常）。","任务模式尚未完整实机检查，如有漏译欢迎反馈。","飓风版：关卡里的街机游戏机玩过一次后，互动提示有时会消失（原版同样如此）。","飓风版：最终章真正打通后的通关存档尚未实机验证（流程已按初代原版逐项对照测试）。"],
 en:["With the console language set to English, the boot copyright warning stays English (the game itself is fine).","Mission mode has not been fully checked in play; please report missing translations.","Hurricane: after playing an in-level arcade cabinet once, its interact prompt sometimes disappears (same in the original).","Hurricane: a clear save from actually beating the final chapter has not been verified in play (the flow was tested step by step against the 2004 original)."],
 ja:["本体の言語が英語のとき、起動時の著作権警告は英語のまま（ゲーム内は正常）。","ミッションモードは全体を確認しきれていません。訳漏れはお知らせください。","ハリケーン版：ステージ内のアーケード筐体は、一度遊ぶと調べる表示が消えることがあります（オリジナルでも発生）。","ハリケーン版：最終章を実際にクリアしたクリアデータは未検証（流れは初代と項目ごとに照合済み）。"]
};

/* ===== state ===== */
const $ = s => document.querySelector(s);
const st = {lang:"zh", ed:"all", ln:"all"};
function load(k){ try { return localStorage.getItem("ngb-cl2-"+k); } catch(e){ return null; } }
function save(k,v){ try { localStorage.setItem("ngb-cl2-"+k, v); } catch(e){} }
{ const nav=(navigator.language||"zh").toLowerCase(); st.lang = nav.startsWith("ja") ? "ja" : nav.startsWith("zh") ? "zh" : "en"; }
const sl = load("lang"); if (UI[sl]) st.lang = sl;
const h = location.hash.slice(1); if (UI[h]) st.lang = h;
const se = load("ed"); if (["all","base","new","origin"].includes(se)) st.ed = se;
const sn = load("ln"); if (["all","zh","jp"].includes(sn)) st.ln = sn;

const ED_COLOR = {base:"var(--ed-base)",new:"var(--ed-new)",origin:"var(--ed-origin)"};
function lines(it){
  const s = new Set(it.l.split(" "));
  if (!it.only){ if (s.has("B")) s.add("B2"); if (s.has("C")) s.add("C2"); }
  return ORDER.filter(k => s.has(k));
}
function selected(){ return ORDER.filter(k => (st.ed==="all"||LINE[k].ed===st.ed) && (st.ln==="all"||LINE[k].lang===st.ln)); }
function lineLabel(k, U){ return `${U.ed[LINE[k].ed]}${LINE[k].ed==="base"?"":" · "+U.lang[LINE[k].lang]}`; }
/* compact edition labels for an item: 全部 / 基本版 / 飓风 / new / origin, with a language suffix when only one language */
function itemTags(ls, U){
  const has = k => ls.includes(k), out = [];
  if (ls.length === 5) return [[U.all,"var(--ash)"]];
  const part = (a,b) => has(a)&&has(b) ? "" : has(a) ? " · "+U.lang.zh : has(b) ? " · "+U.lang.jp : null;
  if (has("A")) out.push([U.ed.base,ED_COLOR.base]);
  const pn = part("B","C"), po = part("B2","C2");
  if (pn !== null && pn === po) out.push([U.hur+pn,"var(--gold)"]);
  else { if (pn !== null) out.push([U.ed.new+pn,ED_COLOR.new]); if (po !== null) out.push([U.ed.origin+po,ED_COLOR.origin]); }
  return out;
}
function tx(o){ return o ? (o[st.lang] || o.zh) : ""; }

function visible(){
  const sel = selected(), out = [];
  for (const r of RELEASES){
    const items = r.items.filter(it => lines(it).some(k => sel.includes(k)));
    if (items.length) out.push({r, items, vers: ORDER.filter(k => r.v[k] && sel.includes(k))});
  }
  return out;
}

function render(){
  const U = UI[st.lang];
  document.documentElement.lang = {zh:"zh-CN",en:"en",ja:"ja"}[st.lang];
  document.title = {zh:"黑之章汉化 更新日志",en:"NGB Chinese Patch Changelog",ja:"NGB 中国語化 更新履歴"}[st.lang];
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = U[e.dataset.i]);
  document.querySelectorAll("[data-ih]").forEach(e => e.innerHTML = U[e.dataset.ih]);
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === st.lang));

  $("#eds").innerHTML = ["base","new","origin"].map(ed => {
    const ks = ORDER.filter(k => LINE[k].ed === ed);
    return `<button class="ed" type="button" style="--c:${ED_COLOR[ed]}" data-ed="${ed}">
      <div class="n">${U.ed[ed]}</div><div class="tag">${U.edTag[ed]}</div>
      <div class="vs">${ks.map(k => `<span class="v"><small>${U.lang[LINE[k].lang]}</small>${LATEST[k]}</span>`).join("")}</div>
      <p>${U.edDesc[ed]}</p></button>`;
  }).join("");

  const cell = v => v === 1 ? `<span class="y">✓</span>` : v === 0 ? `<span class="no">—</span>` : `<span class="txt">${tx(v)}</span>`;
  $("#feat").innerHTML = `<table><thead><tr><th>${U.featCol}</th><th class="base">${U.ed.base}</th><th class="new">${U.ed.new}</th><th class="origin">${U.ed.origin}</th></tr></thead><tbody>` +
    FEAT.map(g => `<tr class="grp-row"><th colspan="4">${tx(g.g)}</th></tr>` + g.rows.map(r =>
      `<tr><td><span class="fn">${tx(r.n)}</span><span class="fd">${tx(r.d)}</span></td><td class="c">${cell(r.base)}</td><td class="c">${cell(r.h ?? r.new)}</td><td class="c">${cell(r.h ?? r.origin)}</td></tr>`).join("")).join("") + `</tbody></table>`;
  $("#issues").innerHTML = ISSUES[st.lang].map(i => `<li>${i}</li>`).join("");
  const C = CMP[st.lang];
  $("#cmp").innerHTML = `<p class="intro">${C.intro}</p><div class="tbl"><table>
    <thead><tr><th>${U.vs}</th><th class="new">${U.ed.new}</th><th class="origin">${U.ed.origin}</th></tr></thead>
    <tbody>${C.rows.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div>
    <p class="foot">${C.foot}</p>`;

  $("#fEd").innerHTML = `<span class="lbl">${U.fEd}</span>` + [["all",U.all,""],["base",U.ed.base,ED_COLOR.base],["new",U.ed.new,ED_COLOR.new],["origin",U.ed.origin,ED_COLOR.origin]]
    .map(([v,t,c]) => `<button class="chip" type="button" data-fed="${v}" aria-pressed="${st.ed===v}" ${c?`style="--c:${c}"`:""}>${c?"<i></i>":""}${t}</button>`).join("");
  $("#fLang").innerHTML = `<span class="lbl">${U.fLang}</span>` + [["all",U.allLang],["zh",U.lang.zh],["jp",U.lang.jp]]
    .map(([v,t]) => `<button class="chip" type="button" data-fln="${v}" aria-pressed="${st.ln===v}">${t}</button>`).join("");

  const vis = visible(); let html = "", day = "", n = 0;
  for (const {r, items, vers} of vis){
    n += items.length;
    if (r.date !== day){ html += `<div class="day">${r.date}</div>`; day = r.date; }
    const flags = (r.latest ? `<span class="flag latest">${U.flag.latest}</span>` : "") + (r.flags||[]).map(f => `<span class="flag ${f}">${U.flag[f]}</span>`).join("");
    html += `<article class="rel${r.latest?" latest":""}${r.withdrawn?" withdrawn":""}">
      <div class="rhead"><h3>${tx(r.title)}</h3><div class="flags">${flags}</div></div>
      ${vers.length ? `<div class="vers">${vers.map(k => `<span class="ver" style="--c:${ED_COLOR[LINE[k].ed]}" title="${lineLabel(k,U)}">${r.v[k]}<small>${lineLabel(k,U)}</small></span>`).join("")}</div>` : ""}
      ${r.lead ? `<p class="lead">${tx(r.lead)}</p>` : ""}
      <ul class="items">${items.map(it => `<li><span class="kind k-${it.k}">${U.kind[it.k]}</span><div class="body">${tx(it.t)}<span class="dots">${itemTags(lines(it),U).map(([s,c]) => `<span style="--c:${c}">${s}</span>`).join("")}</span>${it.note ? `<div class="note${it.ok?" ok":""}">${it.ok?"✓":"⚠"} ${tx(it.note)}</div>` : ""}</div></li>`).join("")}</ul>
    </article>`;
  }
  $("#tl").innerHTML = html || `<p class="empty">${U.empty}</p>`;
  $("#count").textContent = U.count(vis.length, n);
  $("#dlLink").href = DL_URL; $("#dlJp").href = DL_JP;
  document.querySelector(".dl").classList.toggle("ja-first", st.lang === "ja");
  $("#foot").innerHTML = `<div class="dlfoot">${U.dlFoot}<a href="${DL_URL}" target="_blank" rel="noopener">${DL_URL}</a></div><div class="dlfoot">${U.dlJpFoot}<a href="${DL_JP}" target="_blank" rel="noopener">${DL_JP}</a></div><div>${U.credit}</div><div>${U.legal}</div><div class="priv">${U.priv}</div><div>${U.base}</div><div>${U.art}</div>`;
}

/* ===== markdown export (current language + filter) ===== */
function strip(s){ return s.replace(/<b>(.*?)<\/b>/g,"**$1**").replace(/<br>/g," ").replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&nbsp;/g," "); }
function toMarkdown(){
  const U = UI[st.lang], C = CMP[st.lang], L = [];
  L.push(`# ${strip(U.h1)}`, "", `> ${U.sub}`, "", `**${U.dl}** · ${U.dlSub}: <${DL_URL}>  （${U.dlCode} \`${DL_CODE}\`）`, "", `**${U.dlJp}** · ${U.dlJpSub}: <${DL_JP}>`, "");
  L.push(`## ${U.edTitle}`, "");
  for (const ed of ["base","new","origin"]){
    const ks = ORDER.filter(k => LINE[k].ed === ed);
    L.push(`- **${U.ed[ed]}**（${U.edTag[ed]}）：${ks.map(k => `${U.lang[LINE[k].lang]} \`${LATEST[k]}\``).join(" / ")}。${U.edDesc[ed]}`);
  }
  const mc = v => v === 1 ? "✓" : v === 0 ? "—" : tx(v);
  L.push("", `## ${U.featTitle}`, "", U.featSub, "", `| ${U.featCol} | ${U.ed.base} | ${U.ed.new} | ${U.ed.origin} |`, "|---|---|---|---|");
  for (const g of FEAT){
    L.push(`| **${tx(g.g)}** | | | |`);
    for (const r of g.rows) L.push(`| **${tx(r.n)}**：${tx(r.d)} | ${mc(r.base)} | ${mc(r.h ?? r.new)} | ${mc(r.h ?? r.origin)} |`);
  }
  L.push("", `### ${U.issuesTitle}`, "", ...ISSUES[st.lang].map(i => `- ${i}`));
  L.push("", `## ${U.cmpTitle}`, "", C.intro, "", `| ${U.vs||" "} | ${U.ed.new} | ${U.ed.origin} |`, "|---|---|---|");
  for (const r of C.rows) L.push(`| ${r.join(" | ")} |`);
  L.push("", C.foot, "");
  const sel = selected();
  const fl = `${U.fEd}: ${st.ed==="all"?U.all:U.ed[st.ed]} · ${U.fLang}: ${st.ln==="all"?U.allLang:U.lang[st.ln]}`;
  L.push(`## Changelog`, "", `_${fl}_`, "");
  for (const {r, items, vers} of visible()){
    const flags = [r.latest?U.flag.latest:null, ...(r.flags||[]).map(f => U.flag[f])].filter(Boolean);
    L.push(`### ${r.date} · ${strip(tx(r.title))}${flags.length?`  [${flags.join(" / ")}]`:""}`, "");
    if (vers.length) L.push(vers.map(k => `\`${r.v[k]}\` ${lineLabel(k,U)}`).join(" · "), "");
    if (r.lead) L.push(`> ${strip(tx(r.lead))}`, "");
    for (const it of items){
      const tags = itemTags(lines(it),U).map(t => t[0]).join(", ");
      L.push(`- **[${U.kind[it.k]}]** ${strip(tx(it.t))}（${tags}）`);
      if (it.note) L.push(`  - ${it.ok?"✓":"⚠"} ${strip(tx(it.note))}`);
    }
    L.push("");
  }
  L.push("---", "", strip(U.credit), "", U.legal, "", U.priv, "", U.base, "");
  return L.join("\n");
}
function openMd(){ $("#mdText").value = toMarkdown(); $("#mdMsg").textContent = ""; $("#modal").hidden = false; $("#mdSave").focus(); }
function saveMd(){
  const U = UI[st.lang];
  try {
    const blob = new Blob(["﻿"+$("#mdText").value], {type:"text/markdown;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `ngb-hurricane-patch_${st.lang}.md`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    $("#mdMsg").textContent = U.saved;
  } catch(e){ $("#mdMsg").textContent = U.saveFail; }
}
function copyMd(){
  const U = UI[st.lang], ta = $("#mdText");
  const done = () => $("#mdMsg").textContent = U.copied;
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); try { document.execCommand("copy"); done(); } catch(e){} });
  else { ta.select(); try { document.execCommand("copy"); done(); } catch(e){} }
}
function doPrint(){
  const t0 = Date.now();
  try { window.print(); } catch(e){}
  /* print() returns at once when the frame refuses it (sandboxed viewers); tell the reader what to do */
  if (Date.now() - t0 < 50 && window.self !== window.top) alertBar(UI[st.lang].printFail);
}
function alertBar(msg){ openMd(); $("#mdMsg").textContent = msg; }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.lang){ st.lang = b.dataset.lang; save("lang", st.lang); render(); }
  else if (b.dataset.fed){ st.ed = b.dataset.fed; save("ed", st.ed); render(); }
  else if (b.dataset.fln){ st.ln = b.dataset.fln; save("ln", st.ln); render(); }
  else if (b.dataset.ed){ st.ed = b.dataset.ed; st.ln = "all"; save("ed", st.ed); save("ln", st.ln); render(); $(".bar").scrollIntoView({behavior:"smooth"}); }
  else if (b.id === "md") openMd();
  else if (b.id === "pdf") doPrint();
  else if (b.id === "mdSave") saveMd();
  else if (b.id === "mdCopy") copyMd();
  else if (b.id === "dlCopy"){
    const U = UI[st.lang], txt = `${DL_URL}  ${U.dlCode}: ${DL_CODE}`, ok = () => $("#dlMsg").textContent = U.copied;
    const fb = () => { const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); ok(); } catch(e){ $("#dlMsg").textContent = txt; } t.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fb); else fb();
  }
  else if (b.id === "mdClose") $("#modal").hidden = true;
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#modal").hidden = true; });
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") $("#modal").hidden = true; });
render();
</script>
